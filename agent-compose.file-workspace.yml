# 服务器专用注册模板：在统一项目推送到 Git 远端之前，用本地源码包注册验证。
# 与 agent-compose.yml 唯一区别是 workspace.provider=file（源码来自服务器目录，
# 不拉取 GitHub）。正式接入 Git 远端后改用 agent-compose.yml。
# 源码包不含 APK 或其他原始样本；.env 由管理员在服务器单独维护（0600 root:root）。
name: chaitin-triage-agent
env_file: .env

volumes:
  private-knowledge:
    name: chaitin-private-knowledge-base
    external: true
  state-data:
    name: chaitin-triage-state
    external: true

# OctoBus 能力总线原生接入：token 只保存在 daemon，不进入 guest 沙箱。
octobus_servers:
  triage:
    url: ${OCTOBUS_BASE_URL}
    token: ${OCTOBUS_TOKEN}

agents:
  triage-operator:
    provider: codex
    image: chaitin/agent-compose-guest:latest
    driver:
      docker: {}
    workspace:
      provider: file
      path: .
      target: .
    volumes:
      - type: volume
        source: private-knowledge
        target: /knowledge
        read_only: true
      - type: volume
        source: state-data
        target: /triage-state
    # 能力集声明：经 daemon 能力代理暴露两个最小权限 capset。
    capset_ids:
      - triage/security-triage
      - triage/malware-analysis
    env:
      SECURITY_TRIAGE_OCTOBUS_BASE_URL: ${SECURITY_TRIAGE_OCTOBUS_BASE_URL}
      SECURITY_TRIAGE_OCTOBUS_CAPSET_ID: ${SECURITY_TRIAGE_OCTOBUS_CAPSET_ID}
      SECURITY_TRIAGE_OCTOBUS_INSTANCE_ID: ${SECURITY_TRIAGE_OCTOBUS_INSTANCE_ID}
      SECURITY_TRIAGE_OCTOBUS_FULL_SERVICE: ${SECURITY_TRIAGE_OCTOBUS_FULL_SERVICE}
      SECURITY_TRIAGE_OCTOBUS_TOKEN:
        value: ${SECURITY_TRIAGE_OCTOBUS_TOKEN}
        secret: true
      SECURITY_TRIAGE_STATE_DB_PATH: ${SECURITY_TRIAGE_STATE_DB_PATH}
      SECURITY_TRIAGE_THREAT_EVIDENCE_PATH: ${SECURITY_TRIAGE_THREAT_EVIDENCE_PATH}
      # LLM 凭据经 daemon Runtime LLM Facade 托管；下列仅作覆盖项，留空回退。
      SECURITY_TRIAGE_LLM_API_BASE: ${SECURITY_TRIAGE_LLM_API_BASE}
      SECURITY_TRIAGE_LLM_MODEL: ${SECURITY_TRIAGE_LLM_MODEL}
      SECURITY_TRIAGE_LLM_TIMEOUT_MS: ${SECURITY_TRIAGE_LLM_TIMEOUT_MS}
      MALWARE_TRIAGE_OCTOBUS_BASE_URL: ${MALWARE_TRIAGE_OCTOBUS_BASE_URL}
      MALWARE_TRIAGE_OCTOBUS_CAPSET_ID: ${MALWARE_TRIAGE_OCTOBUS_CAPSET_ID}
      MALWARE_TRIAGE_OCTOBUS_INSTANCE_ID: ${MALWARE_TRIAGE_OCTOBUS_INSTANCE_ID}
      MALWARE_TRIAGE_OCTOBUS_AUTH_TOKEN:
        value: ${MALWARE_TRIAGE_OCTOBUS_AUTH_TOKEN}
        secret: true
      MALWARE_TRIAGE_STATE_DB_PATH: ${MALWARE_TRIAGE_STATE_DB_PATH}
      MALWARE_TRIAGE_SAMPLE_REGISTRY_PATH: ${MALWARE_TRIAGE_SAMPLE_REGISTRY_PATH}
      MALWARE_TRIAGE_RAG_CORPUS_PATH: ${MALWARE_TRIAGE_RAG_CORPUS_PATH}
      MALWARE_TRIAGE_RAG_TOP_K: ${MALWARE_TRIAGE_RAG_TOP_K}
      MALWARE_TRIAGE_RAG_MIN_SCORE: ${MALWARE_TRIAGE_RAG_MIN_SCORE}
      MALWARE_TRIAGE_RAG_LLM_CONTEXT_ENABLED: ${MALWARE_TRIAGE_RAG_LLM_CONTEXT_ENABLED}
      MALWARE_TRIAGE_LLM_BASE_URL: ${MALWARE_TRIAGE_LLM_BASE_URL}
      MALWARE_TRIAGE_LLM_MODEL: ${MALWARE_TRIAGE_LLM_MODEL}
      MALWARE_TRIAGE_LLM_TIMEOUT_MS: ${MALWARE_TRIAGE_LLM_TIMEOUT_MS}
      WECOM_WEBHOOK_URL:
        value: ${WECOM_WEBHOOK_URL}
        secret: true
      WECOM_TIMEOUT_MS: ${WECOM_TIMEOUT_MS}
    system_prompt: |
      You operate Chaitin Triage Agent through approved OctoBus capabilities.
      Route alert IDs only through `cd agent && node src/interfaces/cli.js --workflow security --alert-id <id>`.
      Route malware triage only through `cd agent && node src/interfaces/cli.js --workflow malware` with
      a sanitized sample reference, SHA-256, or controlled conversation arguments.
      The `triage/security-triage` and `triage/malware-analysis` capset tools are
      available to you through the daemon capability proxy; use them for capability
      inspection only, never to bypass the CLI workflows.
      Never open, upload, execute, or request an original sample. Never call a
      backend directly. Both workflows preserve trace IDs, retain only minimized
      state, and require human review for non-deterministic decisions.
    scheduler:
      enabled: true
      triggers:
        - name: hourly-security-boundary-check
          cron: "0 * * * *"
          prompt: "Report that alert triage must use the approved security OctoBus capability path; do not read alert contents."
        - name: daily-malware-self-check
          cron: "15 9 * * *"
          prompt: "Run `cd agent && node src/interfaces/cli.js --workflow malware --self-check`; report only check statuses."
