name: chaitin-triage-agent
env_file: .env

volumes:
  private-knowledge:
    name: chaitin-private-knowledge-base
    external: true
  state-data:
    name: chaitin-triage-state
    external: true

# OctoBus 能力总线原生接入：token 只保存在 daemon，不进入 guest 沙箱。
# agent 通过 capset_ids 声明所需能力集，daemon 以 MCP/Connect/gRPC 代理调用。
octobus_servers:
  triage:
    url: ${OCTOBUS_BASE_URL}
    token: ${OCTOBUS_TOKEN}

agents:
  triage-operator:
    provider: codex
    image: chaitin/agent-compose-guest:latest
    driver:
      docker: {}
    workspace:
      provider: git
      url: https://github.com/ch7pairsq/chaitin-triage-agent.git
      ref: main
      target: .
    volumes:
      - type: volume
        source: private-knowledge
        target: /knowledge
        read_only: true
      - type: volume
        source: state-data
        target: /triage-state
    # 能力集声明：经 daemon 能力代理暴露最小权限 capset（演示仅启用安全告警降噪）。
    # 真实 OctoBus token 由 daemon 持有（见上方 octobus_servers.triage）。
    # start by zhangyuqiao，仅注册安全运营分析
    capset_ids:
      - triage/security-triage
    env:
      SECURITY_TRIAGE_OCTOBUS_BASE_URL: ${SECURITY_TRIAGE_OCTOBUS_BASE_URL}
      SECURITY_TRIAGE_OCTOBUS_CAPSET_ID: ${SECURITY_TRIAGE_OCTOBUS_CAPSET_ID}
      SECURITY_TRIAGE_OCTOBUS_INSTANCE_ID: ${SECURITY_TRIAGE_OCTOBUS_INSTANCE_ID}
      SECURITY_TRIAGE_OCTOBUS_FULL_SERVICE: ${SECURITY_TRIAGE_OCTOBUS_FULL_SERVICE}
      SECURITY_TRIAGE_OCTOBUS_TOKEN:
        value: ${SECURITY_TRIAGE_OCTOBUS_TOKEN}
        secret: true
      SECURITY_TRIAGE_STATE_DB_PATH: ${SECURITY_TRIAGE_STATE_DB_PATH}
      SECURITY_TRIAGE_THREAT_EVIDENCE_PATH: ${SECURITY_TRIAGE_THREAT_EVIDENCE_PATH}
      # LLM 走 agent-compose Runtime LLM Facade：真实 provider key 只配置在
      # daemon .env（LLM_API_ENDPOINT/LLM_API_KEY/LLM_MODEL），daemon 向沙箱
      # 注入 scoped token 与 facade URL，不注入真实 key。下列 BASE/MODEL 仅作
      # 覆盖项，留空即回退到 daemon 注入的 LLM_API_ENDPOINT / LLM_MODEL。
      SECURITY_TRIAGE_LLM_API_BASE: ${SECURITY_TRIAGE_LLM_API_BASE}
      SECURITY_TRIAGE_LLM_MODEL: ${SECURITY_TRIAGE_LLM_MODEL}
      SECURITY_TRIAGE_LLM_TIMEOUT_MS: ${SECURITY_TRIAGE_LLM_TIMEOUT_MS}
      WECOM_WEBHOOK_URL:
        value: ${WECOM_WEBHOOK_URL}
        secret: true
      WECOM_TIMEOUT_MS: ${WECOM_TIMEOUT_MS}
    #end
    system_prompt: |
      You operate Chaitin Triage Agent (security alert triage demo) through
      approved OctoBus capabilities.
      Route alert IDs only through `cd agent && node src/interfaces/cli.js --workflow security --alert-id <id>`.
      The `triage/security-triage` capset tools are available to you through the
      daemon capability proxy; use them for capability inspection only, never to
      bypass the CLI workflow.
      The malware sample triage workflow is not enabled in this demo; reject any
      request to analyze samples.
      Never call a backend directly. The workflow preserves trace IDs, retains
      only minimized state, and requires human review for non-deterministic
      decisions.
    scheduler:
      enabled: true
      triggers:
        - name: hourly-security-boundary-check
          cron: "0 * * * *"
          prompt: "Report that alert triage must use the approved security OctoBus capability path; do not read alert contents."
