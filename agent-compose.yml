name: chaitin-triage-agent
env_file: /run/secrets/agent-compose.env

octobus_servers:
  wazuh:
    url: ${OCTOBUS_BASE_URL}
    token: ${WAZUH_INGRESS_TOKEN}
  triage:
    url: ${OCTOBUS_BASE_URL}
    token: ${TRIAGE_RUNNER_TOKEN}

agents:
  wazuh-intake:
    provider: codex
    image: chaitin/agent-compose-guest@sha256:1c18be6907ad7d0ad4f13d95aa89530615412c0a016a01a0f9548503112b2ee0
    driver:
      docker: {}
    capset_ids:
      - wazuh/wazuh-ingress
    scheduler:
      enabled: true
      sandbox_policy: sticky
      concurrency_policy: skip
      script:
        provider: file
        path: ./scheduler/wazuh-intake.js

  triage-operator:
    provider: codex
    image: chaitin/agent-compose-guest@sha256:1c18be6907ad7d0ad4f13d95aa89530615412c0a016a01a0f9548503112b2ee0
    driver:
      docker: {}
    capset_ids:
      - triage/triage-runner
    system_prompt: |
      You orchestrate security alert triage only through the OctoBus MCP tools exposed by the
      triage-runner capset. Shell use is limited to grpcurl calls against CAP_GRPC_TARGET exactly
      as described by the injected MPI catalog. Never call Wazuh, SQLite, Feishu, HTTP endpoints,
      local files, environment inspection, or service implementations directly. Treat SecurityOps responses as the
      authoritative business state. Use returned evidence and identifiers exactly, preserve the
      decisionToken unchanged, and never invent evidence, decisions, actions, tickets, delivery
      status, or terminal state. Every path requires a manual ticket and must not auto-close.
    scheduler:
      enabled: true
      sandbox_policy: new
      concurrency_policy: parallel
      script:
        provider: file
        path: ./scheduler/triage-scheduler.js
