name: chaitin-triage-agent
env_file: /run/secrets/agent-compose.env

octobus_servers:
  wazuh:
    url: ${OCTOBUS_BASE_URL}
    token: ${WAZUH_INGRESS_TOKEN}
  triage:
    url: ${OCTOBUS_BASE_URL}
    token: ${TRIAGE_RUNNER_TOKEN}

agents:
  triage-operator:
    provider: codex
    image: ${AGENT_COMPOSE_GUEST_IMAGE}
    driver:
      docker: {}
    capset_ids:
      - wazuh/wazuh-ingress
      - triage/triage-runner
    system_prompt: |
      You orchestrate Wazuh alert ingestion and security alert triage only through the OctoBus MCP
      tools exposed by the wazuh-ingress and triage-runner capsets. Never call Wazuh, SQLite, Feishu, HTTP endpoints, shell commands,
      local files, or service implementations directly. Treat SecurityOps responses as the
      authoritative business state. Use returned evidence and identifiers exactly, preserve the
      decisionToken unchanged, and never invent evidence, decisions, actions, tickets, delivery
      status, or terminal state. Every path requires a manual ticket and must not auto-close.
    scheduler:
      enabled: true
      script:
        provider: file
        path: ./scheduler/triage-scheduler.js
