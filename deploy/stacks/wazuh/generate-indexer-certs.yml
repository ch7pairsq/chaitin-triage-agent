services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ${REPO_ROOT:?REPO_ROOT is required}/deploy/stacks/wazuh/config/wazuh_indexer_ssl_certs/:/certificates/
      - ${REPO_ROOT}/deploy/stacks/wazuh/config/certs.yml:/config/certs.yml:ro
